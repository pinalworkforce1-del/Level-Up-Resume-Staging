name: Deploy isolated Nova resume staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-staging.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isolated-resume-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned verified source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pinalworkforce1-del/LU_Discovery
          ref: 7dc2cb642a621dbb19699270f3d62835e1dfe4c6
          persist-credentials: false
      - name: Validate exact staging source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "7dc2cb642a621dbb19699270f3d62835e1dfe4c6"
          test -s public/northern-resume-direct/index.html
          test -s public/northern-resume-direct/app.js
          test -s public/northern-resume-direct/levelup-guard.js
          test -s public/northern-resume-direct/levelup-resume-cloud.js
      - name: Prepare isolated site root
        shell: bash
        run: |
          mkdir -p _site
          cp -a public/northern-resume-direct/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/levelup-guard.js
          if grep -q 'https://pinalworkforce1-del.github.io/Level_Up_Portal/career-tree-next/ready-2-work/#map' _site/app.js; then
            echo 'Return URL verified'
          else
            echo 'Missing expected return route'; exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to separate staging Pages site
        id: deployment
        uses: actions/deploy-pages@v4
